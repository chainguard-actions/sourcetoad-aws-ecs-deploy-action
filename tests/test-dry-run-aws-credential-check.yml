name: Test dry run skips AWS credential error when dry_run is set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action checks: if AWS_USERID is empty AND INPUT_DRY_RUN is empty, then error.
      # When dry_run=true (INPUT_DRY_RUN is non-empty), the credential check is skipped.
      # The action will then proceed to modifyTaskDefinitionFile which calls aws ecs describe-task-definition.
      # With fake credentials, this will fail at the AWS API call (not at the credential guard).
      # We verify the action fails (due to AWS API, not the credential guard) and that
      # the error is NOT the "configure-aws-credentials" error message.
      - name: Run action with dry_run and fake AWS credentials
        id: action
        continue-on-error: true
        uses: .
        with:
          ecs_cluster_name: my-cluster
          ecs_service_name: my-service
          service_task_definition_name: my-task-def
          service_container_image_changes: |
            app|nginx:latest
          dry_run: 'true'
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action failed at AWS API call (not credential guard)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the fake AWS credentials can't call describe-task-definition.
          # It should NOT fail with the "configure-aws-credentials" error (that guard is bypassed by dry_run).
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (AWS API call with fake credentials)"
            exit 1
          fi
          echo "PASS: action failed as expected (at AWS API call, not credential guard)"
