name: Test - No AWS Credentials Failure
# Verifies the action exits non-zero when AWS credentials are not configured.
# The action always calls `aws sts get-caller-identity` at startup (set -e),
# so without valid credentials it must fail.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action without AWS credentials
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          ecs_service_name: test-service
          service_task_definition_name: test-task
          service_container_image_changes: |
            app|nginx:latest
          dry_run: 'false'

      - name: Assert action failed (no credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials"
