name: Test prepare task definition without image changes fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action expecting failure
        id: action
        continue-on-error: true
        uses: .
        with:
          ecs_cluster_name: my-cluster
          ecs_service_name: my-service
          service_task_definition_name: my-task-def
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_definition_name: my-prepare-task-def
          dry_run: 'true'
        env:
          AWS_ACCESS_KEY_ID: fake-key
          AWS_SECRET_ACCESS_KEY: fake-secret
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when prepare_task_definition_name is set without prepare_task_container_image_changes"
            exit 1
          fi
          echo "PASS: action correctly failed"
