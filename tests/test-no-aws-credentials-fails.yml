name: Test action fails without AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action expecting failure (no AWS credentials configured)
        id: action
        continue-on-error: true
        uses: .
        with:
          ecs_cluster_name: my-cluster
          ecs_service_name: my-service
          service_task_definition_name: my-task
          service_container_image_changes: |
            app|nginx:latest
          dry_run: 'false'

      - name: Assert action failed due to missing AWS credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no AWS credentials are configured"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials"
