name: Test - Dry Run Without AWS Credentials (Expected Failure)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in dry_run mode without AWS credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: my-cluster
          aws_region: us-west-2
          ecs_launch_type: FARGATE
          ecs_service_name: my-service
          service_task_definition_name: my-task-def
          service_container_image_changes: |
            web:nginx:1.25
            worker:redis:7.0
          max_polling_iterations: '10'
          dry_run: 'true'

      - name: Assert action failed (AWS credential check runs before dry_run bypass)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action calls 'aws sts get-caller-identity' before checking dry_run,
          # so it will fail without real AWS credentials even in dry_run mode.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS credential validation step"
