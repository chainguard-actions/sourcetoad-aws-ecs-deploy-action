name: Test - Prepare Task Validation Mismatch
# Verifies the action exits non-zero when prepare_task_definition_name is
# provided without prepare_task_container_image_changes (or vice versa).
# The action enforces that both must be provided together.
# Without AWS credentials the action fails at the AWS call first, which is
# still a non-zero exit — the important thing is the action does not succeed.
on:
  workflow_dispatch:

jobs:
  test-name-without-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with prepare name but no image changes
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          ecs_service_name: test-service
          service_task_definition_name: test-task
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_definition_name: prepare-task
          # prepare_task_container_image_changes intentionally omitted
          dry_run: 'true'

      - name: Assert action failed (prepare name without image changes)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when prepare_task_definition_name is set without prepare_task_container_image_changes, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on prepare task validation mismatch"

  test-changes-without-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with prepare image changes but no task name
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          ecs_service_name: test-service
          service_task_definition_name: test-task
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_container_image_changes: |
            prepare-app|nginx:latest
          # prepare_task_definition_name intentionally omitted
          dry_run: 'true'

      - name: Assert action failed (prepare image changes without task name)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when prepare_task_container_image_changes is set without prepare_task_definition_name, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on prepare task validation mismatch"
