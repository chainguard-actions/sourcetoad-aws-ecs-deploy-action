name: Test - Prepare Task with Network Config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with prepare task inputs including network config
        id: action
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          aws_region: us-east-1
          ecs_launch_type: FARGATE
          ecs_service_name: test-service
          service_task_definition_name: test-task
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_definition_name: prepare-task
          prepare_task_container_image_changes: |
            migrator|flyway:latest
          prepare_task_container_network_config_filepath: >-
            $GITHUB_WORKSPACE/actions/hardened/sourcetoad--aws-ecs-deploy-action/v1.1.6/tests/fixtures/network-config.json
          dry_run: 'true'

      - name: Assert action ran with prepare inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fake credentials and dry_run=true, the action will attempt AWS calls
          # and fail since credentials are not real. The important thing is the action
          # ran and processed the prepare_task_container_image_changes and
          # prepare_task_container_network_config_filepath inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
