name: Test - Prepare Image Changes Without Task Definition Name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with prepare image changes but no task definition name (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          ecs_service_name: test-service
          service_task_definition_name: test-task-def
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_container_image_changes: |
            prepare-app|nginx:latest
          # Intentionally omitting prepare_task_definition_name
          dry_run: 'false'

      - name: Assert action failed due to missing prepare task definition name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when prepare_task_container_image_changes is set without prepare_task_definition_name, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on prepare task definition name validation"
