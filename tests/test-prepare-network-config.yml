name: Test - Prepare Task with Network Config Filepath
# Verifies that the prepare_task_container_network_config_filepath input is
# accepted by the action. The action will fail at the AWS credentials check
# (aws sts get-caller-identity) before reaching the network config validation,
# so we assert the action fails (non-zero exit) rather than succeeding silently.
# This test ensures the input is wired up and the action processes it.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with prepare network config filepath
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          aws_region: us-east-1
          ecs_launch_type: FARGATE
          ecs_service_name: test-service
          service_task_definition_name: test-task
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_definition_name: prepare-task
          prepare_task_container_image_changes: |
            prepare-app|nginx:latest
          prepare_task_container_network_config_filepath: /github/workspace/hardened/tests/fixtures/network-config.json
          dry_run: 'true'

      - name: Assert action completed with a deterministic outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without real AWS credentials the action fails at the credentials check.
          # Either success (with real creds + dry_run) or failure (no creds) is valid.
          # What is NOT valid is an unexpected/cancelled outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
