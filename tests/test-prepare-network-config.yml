name: Test - Prepare Task Network Config Filepath
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Provide fake AWS credentials so the CLI initializes
      # dry_run=true means INPUT_DRY_RUN is non-empty, bypassing the credential check
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid network config JSON file for the prepare task
        run: |
          mkdir -p /tmp/ecs-test
          cat > /tmp/ecs-test/network-config.json <<'EOF'
          {
            "awsvpcConfiguration": {
              "subnets": ["subnet-12345678"],
              "securityGroups": ["sg-12345678"],
              "assignPublicIp": "DISABLED"
            }
          }
          EOF

      - name: Run action with prepare task network config filepath (expect failure at AWS call)
        id: action
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          aws_region: us-east-1
          ecs_launch_type: FARGATE
          ecs_service_name: test-service
          service_task_definition_name: test-task-definition
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_definition_name: prepare-task-definition
          prepare_task_container_image_changes: |
            prepare-app|nginx:latest
          prepare_task_container_network_config_filepath: /tmp/ecs-test/network-config.json
          dry_run: 'true'

      - name: Assert action ran (failure expected due to fake AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at the AWS ECS describe-task-definition call
          # since we have fake credentials. This is expected behavior.
          # The important thing is the input was accepted and the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with prepare_task_container_network_config_filepath input and produced a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
