name: Test prepare task with network config filepath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create network config JSON file
        run: |
          mkdir -p /tmp/ecs-test
          cat > /tmp/ecs-test/network-config.json <<'EOF'
          {
            "awsvpcConfiguration": {
              "subnets": ["subnet-12345678"],
              "securityGroups": ["sg-12345678"],
              "assignPublicIp": "DISABLED"
            }
          }
          EOF

      - name: Run action with prepare network config filepath (expects failure - no AWS credentials)
        id: action
        continue-on-error: true
        uses: .
        with:
          ecs_cluster_name: my-cluster
          ecs_service_name: my-service
          service_task_definition_name: my-task
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_definition_name: my-prepare-task
          prepare_task_container_image_changes: |
            prepare-app|nginx:latest
          prepare_task_container_network_config_filepath: /tmp/ecs-test/network-config.json
          dry_run: 'false'

      - name: Assert action failed (no AWS credentials configured)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no AWS credentials are configured"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials (prepare_task_container_network_config_filepath input was accepted)"
