name: Test - Prepare Task With Network Config Filepath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with prepare task network config filepath (expect failure - no AWS credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          aws_region: us-east-1
          ecs_launch_type: FARGATE
          ecs_service_name: test-service
          service_task_definition_name: test-task-def
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_definition_name: prepare-task-def
          prepare_task_container_image_changes: |
            prepare|alpine:latest
          prepare_task_container_network_config_filepath: >-
            $GITHUB_WORKSPACE/actions/hardened/sourcetoad--aws-ecs-deploy-action/v1.2.0/tests/fixtures/network-config.json
          dry_run: 'false'

      - name: Assert action failed (no AWS credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials when prepare_task_container_network_config_filepath is set"
