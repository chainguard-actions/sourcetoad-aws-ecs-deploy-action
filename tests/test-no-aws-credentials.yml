name: Test action fails gracefully without AWS credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Ensure no AWS credentials are available
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
        with:
          ecs_cluster_name: my-cluster
          ecs_service_name: my-service
          service_task_definition_name: my-task-def
          service_container_image_changes: |
            app|nginx:latest
          # dry_run is false (default) so the credential check is enforced

      - name: Assert action failed without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no AWS credentials are configured"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials"
