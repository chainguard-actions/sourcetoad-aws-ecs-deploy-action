name: Test - Prepare Task Validation (Name Without Changes)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with prepare name but no prepare changes (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          ecs_service_name: test-service
          service_task_definition_name: test-task-definition
          service_container_image_changes: |
            app:nginx:latest
          prepare_task_definition_name: prepare-task-definition
          # prepare_task_container_image_changes intentionally omitted
          dry_run: 'false'

      - name: Assert action failed due to missing prepare image changes
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when prepare name is set without prepare image changes, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with prepare name but no prepare image changes"
