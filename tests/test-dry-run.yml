name: Test - Dry Run Mode
# Verifies the action behaviour in dry_run mode.
# With dry_run=true the action skips all AWS write operations (register task
# definition, update service) and exits 0 after the read-only phase.
# However, the action still calls `aws sts get-caller-identity` and
# `aws ecs describe-task-definition` which require real AWS credentials.
# Without credentials the action exits non-zero — this test asserts that
# the action does NOT succeed silently (i.e. it either succeeds with dry-run
# or fails due to missing credentials, never silently passes with wrong output).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action in dry_run mode
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          aws_region: us-east-1
          ecs_launch_type: FARGATE
          ecs_service_name: test-service
          service_task_definition_name: test-task
          service_container_image_changes: |
            app|nginx:latest
          max_polling_iterations: '60'
          dry_run: 'true'

      - name: Assert action did not succeed unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In a real environment with AWS credentials, dry_run=true should
          # succeed (exit 0). Without credentials it should fail (exit non-zero).
          # Either way, the action must not produce an unexpected outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with a deterministic outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
