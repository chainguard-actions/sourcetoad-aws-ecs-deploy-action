name: Test - Default Input Values
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with only required inputs (using defaults for optional ones)
        id: action
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: prod-cluster
          ecs_service_name: prod-service
          service_task_definition_name: prod-task-def
          service_container_image_changes: |
            app:myrepo/myimage:v2.0.0
          # aws_region defaults to 'us-east-1'
          # ecs_launch_type defaults to 'FARGATE'
          # max_polling_iterations defaults to '60'
          # dry_run defaults to 'false'

      - name: Assert action failed at AWS credential check (expected without real creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without real AWS credentials, the action will fail at the credential
          # validation step. This confirms the action starts correctly with only
          # required inputs and reaches the AWS validation step.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly started with required inputs and failed at AWS validation"
