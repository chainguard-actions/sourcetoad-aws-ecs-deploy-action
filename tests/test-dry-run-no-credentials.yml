name: Test - Dry Run Without AWS Credentials (Expected Failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in dry_run mode without AWS credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ecs_cluster_name: test-cluster
          aws_region: us-east-1
          ecs_launch_type: FARGATE
          ecs_service_name: test-service
          service_task_definition_name: test-task-def
          service_container_image_changes: |
            app|nginx:latest
          dry_run: 'true'

      - name: Assert action failed (AWS credential check fails before dry_run skip)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials even in dry_run mode, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials"
