name: Test prepare image changes without task definition name fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action expecting failure
        id: action
        continue-on-error: true
        uses: .
        with:
          ecs_cluster_name: my-cluster
          ecs_service_name: my-service
          service_task_definition_name: my-task
          service_container_image_changes: |
            app|nginx:latest
          prepare_task_container_image_changes: |
            prepare-app|nginx:latest
          # prepare_task_definition_name intentionally omitted
          dry_run: 'true'

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when prepare_task_container_image_changes is set without prepare_task_definition_name"
            exit 1
          fi
          echo "PASS: action correctly failed"
